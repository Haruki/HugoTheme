<script>
  (function () {
    // Site is served both at the LAN root and under a /wiki/ subpath, so resolve
    // the JS path from the current URL instead of baseURL.
    var p = location.pathname.indexOf('/wiki/') === 0 ? '/wiki/' : '/';
    var s = document.createElement('script');
    s.src = p + 'js/mermaid.min.js';
    s.onload = function () {
      // 'base' theme with variables matched to the wiki palette (style-new.css):
      // black canvas, #202020 nodes, whitesmoke text, gold accents.
      mermaid.initialize({
        securityLevel: 'loose',
        look: 'handDrawn',
        theme: 'base',
        themeVariables: {
          background: '#000000',
          textColor: '#f5f5f5',
          primaryColor: '#202020',
          primaryTextColor: '#f5f5f5',
          primaryBorderColor: '#9e9e9e',
          lineColor: '#ffd000',
          secondaryColor: '#292929',
          secondaryTextColor: '#f5f5f5',
          secondaryBorderColor: '#8a8a8a',
          tertiaryColor: '#161616',
          tertiaryTextColor: '#b9b9b9',
          tertiaryBorderColor: '#4d4d4d',
          noteBkgColor: '#292929',
          noteBorderColor: '#ffd000',
          noteTextColor: '#f5f5f5',
          mainBkg: '#202020',
          nodeBorder: '#9e9e9e',
          titleColor: '#ffd000',
          edgeLabelBackground: '#1a1a1a',
          clusterBkg: '#0d0d0d',
          clusterBorder: '#4d4d4d',
          defaultLinkColor: '#ffd000',
          actorBkg: '#202020',
          actorBorder: '#9e9e9e',
          actorTextColor: '#f5f5f5',
          signalColor: '#ffd000',
          signalTextColor: '#f5f5f5',
          labelBoxBkgColor: '#292929',
          labelBoxBorderColor: '#8a8a8a',
          entityBkg: '#202020',
          entityBorder: '#9e9e9e',
          relationshipColor: '#ffd000',
          relationshipLabelColor: '#f5f5f5',
          attributeBackgroundColor: '#161616',
          // erDiagram attribute rows (only consumed by the ER renderer): keep both dark so
          // whitesmoke text stays readable; unset, base theme computes lighten(mainBkg,75) = #ddd
          rowOdd: '#1a1a1a',
          rowEven: '#202020'
        }
      });
      mermaid.run({ querySelector: 'pre > code.language-mermaid' });
    };
    s.onerror = function () { console.warn('mermaid.min.js not found at ' + s.src); };
    document.head.appendChild(s);
  })();
</script>
